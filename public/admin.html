<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모두의 택시 · 관리자 통계</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>.admin-shell{max-width:900px}.metrics{grid-template-columns:repeat(3,1fr)}.metric b{font-size:38px}.updated{color:#74736f;font-size:13px}@media(max-width:640px){.metrics{grid-template-columns:1fr}}</style>
</head>
<body>
  <main class="admin-shell">
    <h1>모두의 택시 관리자 통계</h1>
    <p class="lede">방문과 주요 버튼 클릭을 고유 브라우저 기준으로 집계합니다.</p>
    <form id="login" class="form-card" style="max-width:420px">
      <label for="password">관리자 비밀번호</label>
      <input id="password" type="password" required autocomplete="current-password" />
      <p id="login-error" class="status err"></p>
      <button class="btn" type="submit">통계 보기</button>
    </form>
    <section id="dash" hidden>
      <p><button class="btn ghost" id="refresh" type="button">새로고침</button> <button class="btn ghost" id="logout" type="button">로그아웃</button></p>
      <div id="metrics" class="metrics"></div>
      <p id="updated" class="updated"></p>
      <p class="help">집계는 이 기능을 배포한 뒤부터 시작됩니다.</p>
    </section>
  </main>
  <script src="/admin.js" type="module"></script>
</body>
</html>
